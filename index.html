<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify to Continue</title>
    
    <!-- Google reCAPTCHA Script -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <style>
        /* Modern Dark Theme UI */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a; /* Slate-900 */
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            text-align: center;
            background: #1e293b; /* Slightly lighter dark for card */
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        /* Loading Spinner */
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #334155;
            border-top: 4px solid #3b82f6; /* Blue-500 */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
            display: none; /* Initially hidden, shows after captcha */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .error {
            color: #ef4444; /* Red-500 */
        }
        /* Captcha Center Alignment */
        .recaptcha-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader" class="spinner"></div>
        <div id="statusMessage" class="message">Please verify you are human to continue.</div>
        
        <!-- Google reCAPTCHA Box -->
        <div id="captchaBox" class="recaptcha-wrapper">
            <div class="g-recaptcha" 
                 data-sitekey="6LeHbDgtAAAAAHzhZ-6CpEARRGmTLVs0GBFGN2DQ" 
                 data-callback="onCaptchaSuccess">
            </div>
        </div>
    </div>

    <script>
        // 1. Aapka Main URL
        const MAIN_URL = "https://ascinemaa.fun/watch?src=";

        // 2. Current URL se query parameters fetch karna
        const urlParams = new URLSearchParams(window.location.search);
        const srcBase64 = urlParams.get('src');

        const statusMessage = document.getElementById('statusMessage');
        const loader = document.getElementById('loader');
        const captchaBox = document.getElementById('captchaBox');

        // Agar URL mein ?src= missing hai, to pehle hi error dikha do aur Captcha hata do
        if (!srcBase64) {
            captchaBox.style.display = 'none';
            statusMessage.classList.add('error');
            statusMessage.innerText = "Error: Link is broken or missing valid parameters.";
        }

        // 3. Jab User Captcha successfully solve kar dega tab yeh function run hoga
        function onCaptchaSuccess(token) {
            if (srcBase64) {
                // Captcha box ko hide karo aur Loading Spinner show karo
                captchaBox.style.display = 'none';
                loader.style.display = 'block';
                statusMessage.innerText = "Verification successful! Redirecting...";
                
                // Final URL generate karna
                const finalDestination = MAIN_URL + srcBase64;
                
                // 1 second delay ke baad Redirect karna taaki smooth transition ho
                setTimeout(() => {
                    window.location.replace(finalDestination);
                }, 1000);
            }
        }
    </script>
</body>
</html>
